<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Story Player</title>
    <link rel="stylesheet" href="storyeditor.css?v=2">

    <script src="twine-exporter.js?v=3"></script>
    <script src="vendor/sugarcube-2.37.3/format.js?v=2.37.3"></script>
    <script src="sharing-utils.js?v=2"></script>
    <script src="story-engine.js?v=2"></script>
    <script src="story-graph.js?v=2"></script>
    <script src="ui-controller.js?v=2"></script>
    <script src="main.js?v=2"></script>
</head>
<body>
    <h1>Interactive Story Player</h1>

    <div id="input-section">
        <div class="header-row">
            <h2><span class="toggle-icon">▼</span>Story JSON Editor</h2>
        </div>

        <div id="json-input-container">
            <textarea id="json-input" placeholder="Paste your story JSON here..."></textarea>
        </div>

        <div class="button-container">
            <button id="load-button">Load Story</button>
            <button id="toggle-input" title="Toggle JSON editor visibility">
                <span class="toggle-icon">▼</span>
            </button>
        </div>

        <div id="error-message" class="error" style="display: none;"></div>
    </div>

    <div id="story-section">
        <div id="story-container">
            <div id="story-title"></div>
            <div id="story-content"></div>
            <div id="choices-container"></div>

            <!-- Put both buttons in one row -->
            <div id="bottom-buttons">
                <button id="share-button" class="story-action-button">Share Story</button>
                <button id="export-button" class="story-action-button">Export Twine HTML</button>
                <button id="reset-button" class="story-action-button">Reset Story</button>
            </div>

            <!-- The share URL container can remain below -->
            <div id="share-url-container" style="display: none;">
                <input type="text" id="share-url" readonly>
                <button id="copy-url-button">Copy</button>
            </div>

            <section id="story-graph-section" aria-labelledby="story-graph-title">
                <div class="story-graph-header">
                    <div>
                        <h2 id="story-graph-title">Story Map</h2>
                        <p id="story-graph-status" aria-live="polite"></p>
                    </div>
                    <div class="story-graph-controls" aria-label="Story map controls">
                        <button id="graph-zoom-out" type="button" title="Zoom out">−</button>
                        <button id="graph-zoom-in" type="button" title="Zoom in">+</button>
                        <button id="graph-fit" type="button">Fit</button>
                    </div>
                </div>
                <div class="story-graph-legend" aria-label="Story map legend">
                    <span class="legend-current">Current</span>
                    <span class="legend-visited">Visited</span>
                    <span class="legend-unreachable">Unreachable</span>
                    <span class="legend-broken">Broken link</span>
                </div>
                <div id="story-graph-viewport">
                    <svg
                        id="story-graph"
                        role="img"
                        aria-label="Passages and branches in the loaded story"
                    ></svg>
                </div>
                <p class="story-graph-help">
                    Click a passage to navigate. Drag the background to pan.
                </p>
            </section>
        </div>
    </div>
</body>
</html>
